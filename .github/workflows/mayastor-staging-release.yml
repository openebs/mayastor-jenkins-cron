name: Mayastor Staging Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to be released (e.g. v2.12.0)"
        required: true
        type: string
      retry:
        description: "Await an already-dispatched staging run instead of dispatching a new one"
        required: false
        default: false
        type: boolean
      allow-stale-control-plane:
        description: "Allow mayastor-extensions to pin a control-plane commit older than the control-plane release branch tip"
        required: false
        default: false
        type: boolean

jobs:
  validate:
    name: validate (${{ inputs.tag }})
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve branch from tag
        id: branch
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag ${TAG} must look like vX.Y.Z or vX.Y.Z-<pre> (e.g. v2.12.0, v2.12.0-rc.0)"
            exit 1
          fi
          branch="release/${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          echo "Resolved branch ${branch} from tag ${TAG}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
      - name: Check extensions tracks control-plane release branch tip
        if: ${{ !inputs.allow-stale-control-plane }}
        env:
          GH_TOKEN: ${{ secrets.ORG_CI_GITHUB }}
        run: |
          # mayastor-extensions vendors mayastor-control-plane as a submodule.
          # Its release branch must pin the control-plane release branch tip,
          # otherwise the staging chart would reference a control-plane commit
          # older than the one being released. Re-run with
          # allow-stale-control-plane=true to intentionally stage an older pin.
          ./check-submodule-tip.sh \
            --parent openebs/mayastor-extensions \
            --submodule openebs/mayastor-control-plane \
            --ref "${{ steps.branch.outputs.branch }}"

  staging:
    name: ${{ matrix.repo }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [mayastor, mayastor-control-plane, mayastor-extensions]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dispatch-and-await
        with:
          token: ${{ secrets.ORG_CI_GITHUB }}
          repo: ${{ matrix.repo }}
          branch: ${{ needs.validate.outputs.branch }}
          workflow: staging.yml
          dispatch-inputs: '{ "tag": "${{ inputs.tag }}" }'
          retry: ${{ inputs.retry }}

  report:
    name: report
    needs: staging
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Report pushed artifacts
        uses: ./.github/actions/chart-report
        with:
          tag: ${{ inputs.tag }}

  chart:
    name: chart metadata
    needs: staging
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dump chart metadata
        uses: ./.github/actions/chart-report
        with:
          tag: ${{ inputs.tag }}
          chart-only: "true"
