name: Create Mayastor Release Branch

on:
  workflow_dispatch:
    inputs:
      branch-name:
        description: "Branch to create off develop (e.g. release/2.12)"
        required: true
        type: string
      retry:
        description: "Allow re-running when all release branches already exist"
        required: false
        default: false
        type: boolean
      allow-stale-control-plane:
        description: "Allow mayastor-extensions to pin a control-plane commit older than control-plane develop tip"
        required: false
        default: false
        type: boolean

jobs:
  validate:
    name: validate (${{ inputs.branch-name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check branch name
        run: |
          case "${{ inputs.branch-name }}" in
            release/*) ;;
            *) echo "::error::Branch name must start with 'release/'"; exit 1 ;;
          esac
      - name: Check branches do not already exist
        if: ${{ !inputs.retry }}
        env:
          GH_TOKEN: ${{ secrets.ORG_CI_GITHUB }}
          BRANCH: ${{ inputs.branch-name }}
        run: |
          set -euo pipefail
          repos="spdk-rs mayastor-dependencies mayastor mayastor-control-plane mayastor-extensions"
          all_exist=true
          for repo in $repos; do
            if ! git ls-remote --exit-code --heads \
              "https://x-access-token:${GH_TOKEN}@github.com/openebs/${repo}.git" "$BRANCH" >/dev/null 2>&1; then
              all_exist=false
            fi
          done
          if [ "$all_exist" = true ]; then
            echo "::error::Branch ${BRANCH} already exists in all repos (enable retry to re-run)"
            exit 1
          fi
      - name: Check extensions tracks control-plane develop tip
        if: ${{ !inputs.allow-stale-control-plane }}
        env:
          GH_TOKEN: ${{ secrets.ORG_CI_GITHUB }}
        run: |
          # mayastor-extensions vendors mayastor-control-plane as a submodule.
          # Its develop must pin the control-plane develop tip, otherwise cutting
          # the control-plane release from develop would advance extensions past
          # the commit it was integrated/tested against. Re-run with
          # allow-stale-control-plane=true to intentionally release an older pin.
          ./check-submodule-tip.sh \
            --parent openebs/mayastor-extensions \
            --submodule openebs/mayastor-control-plane

  base:
    name: ${{ matrix.repo }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [spdk-rs]
      fail-fast: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/create-release-branch
        with:
          token: ${{ secrets.ORG_CI_GITHUB }}
          repo: ${{ matrix.repo }}
          branch-name: ${{ inputs.branch-name }}

  dependencies:
    name: mayastor-dependencies
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # mayastor-dependencies is a submodule of both mayastor and mayastor-control-plane.
      # Branch the release from whichever parent's develop  pins the most recent dependencies 
      # commit, rather than from the dependencies develop tip (which may be ahead of both).
      - id: base
        env:
          GH_TOKEN: ${{ secrets.ORG_CI_GITHUB }}
        run: |
          ./latest-submodule-commit.sh --submodule openebs/mayastor-dependencies \
            --parents "openebs/mayastor openebs/mayastor-control-plane"
      - uses: ./.github/actions/create-release-branch
        with:
          token: ${{ secrets.ORG_CI_GITHUB }}
          repo: mayastor-dependencies
          branch-name: ${{ inputs.branch-name }}
          ref: ${{ steps.base.outputs.sha }}

  mayastor:
    name: mayastor
    needs: [base, dependencies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/create-release-branch
        with:
          token: ${{ secrets.ORG_CI_GITHUB }}
          repo: mayastor
          branch-name: ${{ inputs.branch-name }}
          await-image: true
          prepare: |
            ./scripts/set-submodule-branches.sh --branch "$BRANCH"

  controller:
    name: mayastor-controller
    needs: mayastor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/create-release-branch
        with:
          token: ${{ secrets.ORG_CI_GITHUB }}
          repo: mayastor-control-plane
          branch-name: ${{ inputs.branch-name }}
          await-image: true
          prepare: |
            ./scripts/git/set-submodule-branches.sh --branch "$BRANCH"
            ./scripts/rust/branch_ancestor.sh

  extensions:
    name: mayastor-extensions
    needs: controller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: openebs/mayastor-extensions
          ref: develop
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.ORG_CI_GITHUB }}
      - uses: actions/checkout@v7
        with:
          path: jenkins-cron
      - uses: ./.github/actions/setup-nix
        with:
          preFetchNix: ./scripts/helm/shell.nix
      - name: Create release branch
        id: branch
        env:
          BRANCH: ${{ inputs.branch-name }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch ${BRANCH} already exists in openebs/mayastor-extensions, skipping creation"
            # Use the existing branch tip commit time/sha so the earlier image run can still be found.
            git fetch --quiet origin "$BRANCH"
            echo "start-time=$(git log -1 --format=%cI FETCH_HEAD)" >> "$GITHUB_OUTPUT"
            echo "head-sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "start-time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git checkout -b "$BRANCH"

          nix-shell --pure --run "./scripts/helm/publish-chart-yaml.sh --check-chart \"$BRANCH\" --develop-to-release" ./scripts/helm/shell.nix
          ./scripts/git/set-submodule-branches.sh --branch "$BRANCH"
          nix-shell ./scripts/helm/shell.nix --pure --run "SKIP_GIT=1 ./scripts/helm/generate-readme.sh"
          nix-shell ./scripts/helm/shell.nix --pure --run "./scripts/helm/images.sh generate --dependency-update"
          nix-shell ./scripts/helm/shell.nix --pure --run "./scripts/helm/images.sh patch"

          git add -A
          git commit --allow-empty -m "chore: prepare ${BRANCH}"
          git push origin "$BRANCH"
          echo "head-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Await image build
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_CI_GITHUB }}
          WORKFLOW_ID: image.yml
          ORG_NAME: openebs
          REPO_NAME: mayastor-extensions
          REF: ${{ inputs.branch-name }}
          START_TIME: ${{ steps.branch.outputs.start-time }}
          HEAD_SHA: ${{ steps.branch.outputs.head-sha }}
          MAX_FIND_MINUTES: 10
          INTERVAL_SECS: 60
          TIMEOUT_MINUTES: 360
        run: ${{ github.workspace }}/jenkins-cron/wait-for-workflow.sh
