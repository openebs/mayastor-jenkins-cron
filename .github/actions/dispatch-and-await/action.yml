name: Dispatch and Await
description: Dispatch a workflow and await its completion.

inputs:
  token:
    required: true
  repo:
    required: true
  branch:
    required: true
  workflow:
    description: "Workflow file to dispatch and await."
    required: false
    default: nightly-ci.yml
  dispatch-inputs:
    description: "JSON object of inputs passed to the dispatched workflow."
    required: false
    default: ""
  retry:
    description: "Await an already-dispatched run instead of dispatching a new one."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup
      id: start
      shell: bash
      run: |
        if [ "${{ inputs.retry }}" = "true" ]; then
          # Look back so a previously dispatched run can still be found.
          echo "START_TIME=" >> $GITHUB_OUTPUT
        else
          start_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Started at $start_time"
          echo "START_TIME=$start_time" >> $GITHUB_OUTPUT
        fi
    - name: Dispatch
      id: dispatch
      if: inputs.retry != 'true'
      uses: benc-uk/workflow-dispatch@v1
      with:
        token: ${{ inputs.token }}
        repo: openebs/${{ inputs.repo }}
        ref: ${{ inputs.branch }}
        workflow: ${{ inputs.workflow }}
        inputs: ${{ inputs.dispatch-inputs }}
        wait-for-completion: false
    - shell: bash
      run: |
        echo "Dispatched workflow ${{ steps.dispatch.outputs.workflow-id }} for ${{ inputs.repo }}@${{ inputs.branch }}"
    - name: Find workflow
      id: find
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        WORKFLOW_ID: ${{ inputs.workflow }}
        MAX_FIND_MINUTES: 3
        INTERVAL_SECS: 15
        ORG_NAME: openebs
        REPO_NAME: ${{ inputs.repo }}
        REF: ${{ inputs.branch }}
        START_TIME: ${{ steps.start.outputs.START_TIME }}
        WAIT: false
      run: ${{ github.action_path }}/../../../wait-for-workflow.sh
    - name: Await
      id: await
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        WORKFLOW_ID: ${{ inputs.workflow }}
        INTERVAL_SECS: 60
        TIMEOUT_MINUTES: 360
        ORG_NAME: openebs
        REPO_NAME: ${{ inputs.repo }}
        REF: ${{ inputs.branch }}
        RUN_ID: ${{ steps.find.outputs.workflow-id }}
      run: ${{ github.action_path }}/../../../wait-for-workflow.sh
    - name: Print Status
      if: always()
      shell: bash
      run: |
        echo "Workflow for ${{ inputs.repo }}@${{ inputs.branch }} completed with status: ${{ steps.await.outputs.workflow-conclusion }}"
        echo "For more details, see ${{ steps.find.outputs.workflow-url }}"
    - name: Cancel
      if: cancelled()
      shell: bash
      run: |
        curl -s -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: token ${{ inputs.token }}" \
          ${{ steps.find.outputs.workflow-api-url }}/cancel